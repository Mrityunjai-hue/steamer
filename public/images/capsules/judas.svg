<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 215" width="460" height="215">
  <defs>
    <linearGradient id="bg-judas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e140a" />
      <stop offset="50%" stop-color="#38230e" />
      <stop offset="100%" stop-color="#100a04" />
    </linearGradient>
    <radialGradient id="sheen-judas" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="badge-grad-judas" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="460" height="215" fill="url(#bg-judas)" />

  <!-- Ambient Glow -->
  <circle cx="230" cy="80" r="180" fill="url(#sheen-judas)" />

  <!-- Subtle Geometric Grid Lines -->
  <g stroke="white" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="460" y2="40" />
    <line x1="0" y1="90" x2="460" y2="90" />
    <line x1="0" y1="140" x2="460" y2="140" />
    <line x1="0" y1="180" x2="460" y2="180" />
    <line x1="90" y1="0" x2="90" y2="215" />
    <line x1="230" y1="0" x2="230" y2="215" />
    <line x1="370" y1="0" x2="370" y2="215" />
  </g>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="458" height="213" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="2" rx="4" />

  <!-- Category / Franchise Tag Pill (Top Left) -->
  <g transform="translate(20, 24)">
    <rect width="130" height="20" rx="3" fill="#000000" fill-opacity="0.6" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1" />
    <text x="65" y="14" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" letter-spacing="1" text-anchor="middle">NARRATIVE FPS</text>
  </g>

  <!-- Center Watermark Logo Badge -->
  <g transform="translate(230, 85)" text-anchor="middle">
    <!-- Steam / Vault Emblem -->
    <circle cx="0" cy="-10" r="24" fill="#000000" fill-opacity="0.4" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5" />
    <path d="M-8 -10 L0 -18 L8 -10 L4 -10 L4 -2 L-4 -2 L-4 -10 Z" fill="#fbbf24" opacity="0.8" />
  </g>

  <!-- Main Game Title (Centered & High-Impact) -->
  <text x="230" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="0.5" text-anchor="middle">JUDAS</text>

  <!-- Subtitle / Developer -->
  <text x="230" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">GHOST STORY GAMES • KEN LEVINE</text>

  <!-- Bottom Included Bar (Steam Authentic) -->
  <rect x="0" y="185" width="460" height="30" fill="#000000" fill-opacity="0.75" />
  <line x1="0" y1="185" x2="460" y2="185" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <text x="20" y="204" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">STEAM VAULT EDITION</text>

  <g transform="translate(365, 191)">
    <rect width="75" height="18" rx="2" fill="#4c6b22" />
    <text x="37.5" y="13" fill="#beee11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" letter-spacing="0.5" text-anchor="middle">INCLUDED</text>
  </g>
</svg>