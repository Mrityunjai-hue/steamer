<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
 <linearGradient id="bg" x1="12%" y1="0%" x2="88%" y2="100%"><stop stop-color="#16052C"/><stop offset=".55" stop-color="#0B0018"/><stop offset="1" stop-color="#24083E"/></linearGradient>
 <linearGradient id="shell" x1="16%" y1="8%" x2="88%" y2="92%"><stop stop-color="#FFF4FF"/><stop offset=".22" stop-color="#EBCBFF"/><stop offset=".56" stop-color="#C58AFF"/><stop offset=".8" stop-color="#A64AF0"/><stop offset="1" stop-color="#7130C2"/></linearGradient>
