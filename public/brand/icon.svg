 <linearGradient id="arm" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#FFF7FF"/><stop offset=".38" stop-color="#E2B9FF"/><stop offset=".72" stop-color="#B875F4"/><stop offset="1" stop-color="#8A3ED0"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
