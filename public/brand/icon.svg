<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2838" />
      <stop offset="50%" stop-color="#171a21" />
      <stop offset="100%" stop-color="#0e141b" />
    </linearGradient>

    <!-- Cyber Neon Gradient -->
    <linearGradient id="cyanSapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66c0f4" />
      <stop offset="60%" stop-color="#1a9fff" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>

    <!-- Inner Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#66c0f4" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#1a9fff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1a9fff" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Neon Border Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backlight -->
  <circle cx="60" cy="60" r="48" fill="url(#coreGlow)" />

  <!-- Outer Cyber Armor Hex-Shield -->
  <polygon points="60,6 108,28 108,82 60,114 12,82 12,28" 
           fill="url(#shieldPlate)" 
           stroke="#2a475e" 
           stroke-width="2.5" 
           stroke-linejoin="round" />

  <!-- Inner Glowing Aegis Rim -->
  <polygon points="60,14 100,33 100,77 60,105 20,77 20,33" 
           fill="none" 
           stroke="url(#cyanSapphire)" 
           stroke-width="2" 
           stroke-linejoin="round"
           filter="url(#neonGlow)" />

  <!-- Shield Top Tech Accents -->
  <line x1="42" y1="23" x2="78" y2="23" stroke="#66c0f4" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="60" cy="23" r="2" fill="#5ba32b" />

  <!-- Controller Silhouette Body (The Vault Controller) -->
  <!-- Top Bridge & Grips -->
  <path d="M 38 45 
           C 44 42, 76 42, 82 45 
           C 92 50, 97 66, 92 81 
           C 89 89, 81 91, 74 84 
           C 69 79, 66 74, 60 74 
           C 54 74, 51 79, 46 84 
           C 39 91, 31 89, 28 81 
           C 23 66, 28 50, 38 45 Z" 
        fill="#101822" 
        stroke="url(#cyanSapphire)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- D-Pad (Left Controller Grip) -->
  <path d="M 40 57 L 44 57 L 44 53 L 48 53 L 48 57 L 52 57 L 52 61 L 48 61 L 48 65 L 44 65 L 44 61 L 40 61 Z" 
        fill="#66c0f4" />

  <!-- Action Diamond Buttons (Right Controller Grip) -->
  <circle cx="76" cy="54" r="2" fill="#66c0f4" />
  <circle cx="72" cy="59" r="2" fill="#1a9fff" />
  <circle cx="80" cy="59" r="2" fill="#1a9fff" />
  <circle cx="76" cy="64" r="2" fill="#66c0f4" />

  <!-- Center Vault Nexus Dial / Offline Power Symbol -->
  <circle cx="60" cy="59" r="6" fill="#16202d" stroke="#66c0f4" stroke-width="2" />
  <!-- Offline Lock Shackle / Play Core -->
  <path d="M 58 56 L 64 59 L 58 62 Z" fill="#66c0f4" />

  <!-- Bottom Cyber Grip Slits -->
  <line x1="33" y1="74" x2="36" y2="79" stroke="#2a475e" stroke-width="2" stroke-linecap="round" />
  <line x1="87" y1="74" x2="84" y2="79" stroke="#2a475e" stroke-width="2" stroke-linecap="round" />
</svg>
